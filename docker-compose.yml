services:
  seedshift:
    image: ghcr.io/grompty/seedshift:latest
    container_name: seedshift
    volumes:
      # The same share qBittorrent, Radarr and Sonarr use, read-only, at the same path they use.
      - /path/to/data:/data:ro
      - ./config:/config
    ports:
      - "8095:8080"
    restart: unless-stopped
    # Optional: run as a specific user (find the values with: id)
    # user: "1000:1000"
    # Optional: join the network your other containers use, to reach them by name.
    # networks:
    #   - media-network

# networks:
#   media-network:
#     external: true
